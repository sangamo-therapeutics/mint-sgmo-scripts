# from dockerfiles -- for installation within a container

[tool.poetry]
name = "mint-sgmo-scripts"
version = "0.1.0"
description = ""
packages = [
    { include = "minter", from = "src" },
]

[tool.poetry.dependencies]

python = "^3.9"
biopython = "1.85"
cutadapt = "5.2"
pybedtools = "0.12.0"
python-levenshtein = "0.27.1"
pysam = "0.24.0"
logomaker = "0.8"
matplotlib = "3.5.3"
numpy = "1.26.4"
pandas = "*"
scipy="1.13.1"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"


[build-system]
requires = ["poetry-core>=1.0.0", "setuptools>=57.0.0"]
build-backend = "poetry.core.masonry.api"
